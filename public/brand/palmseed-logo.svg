<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER MARK, NOT THE PALMSEED LOGO.

  The official Palmseed logo file was not supplied with this build, so this
  neutral monogram stands in its place. It is deliberately plain so that it is
  never mistaken for the school's real identity, and it is not an
  interpretation or redrawing of it.

  To install the real logo, replace this file (and add a raster copy at
  public/brand/palmseed-logo.png for email clients). Nothing in the code needs
  to change: every surface reads these two paths.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Palmseed Model School">
  <rect width="96" height="96" rx="10" fill="#0B0B0C"/>
  <rect x="6" y="6" width="84" height="84" rx="6" fill="none" stroke="#E51F2B" stroke-width="1.5" opacity="0.55"/>
  <text x="48" y="59"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="600" letter-spacing="1"
        text-anchor="middle" fill="#F6F1EA">PMS</text>
  <rect x="34" y="68" width="28" height="2" fill="#E51F2B"/>
</svg>
