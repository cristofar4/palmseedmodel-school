<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="presentation">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#142019"/>
      <stop offset="0.55" stop-color="#0A1410"/>
      <stop offset="1" stop-color="#050B08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.58" r="0.78">
      <stop offset="0" stop-color="#17604A" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#17604A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#17604A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.84" cy="0.86" r="0.6">
      <stop offset="0" stop-color="#D9B665" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D9B665" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#ground)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#warm)"/>
